[project]
name = "buildbud"
version = "0.1.0"
description = "AI multi-agent code generator: a LangGraph planner-architect-coder pipeline with build and update modes, powered by Groq."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "groq>=0.31.0",
    "langchain>=0.3.27",
    "langchain-core>=0.3.72",
    "langchain-groq>=0.3.7",
    "langgraph>=0.6.3",
    "pip>=25.2",
    "pydantic>=2.11.7",
    "python-dotenv>=1.1.1",
]
